name: dropdown_flutter
description: A Flutter package designed to enhance your app with customizable dropdowns, featuring list data search, network search, and multi-selection.

version: 1.2.1
homepage: https://farhansadikgalib.com
repository: https://github.com/farhansadikgalib/dropdown_flutter
issue_tracker: https://github.com/farhansadikgalib/dropdown_flutter/issues
documentation: https://pub.dev/documentation/dropdown_flutter/latest/

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

screenshots:
  - description: "Simple select, grouped sections and dark theme"
    path: screenshots/preview.png
  - description: "Gallery of every dropdown variant"
    path: screenshots/ss_1.jpg
  - description: "Single select with the list open"
    path: screenshots/ss_2.jpg
  - description: "Multi select with avatars and checkboxes"
    path: screenshots/ss_3.jpg
  - description: "Grouped sections with team headers"
    path: screenshots/ss_4.jpg
  - description: "Search with matched-text highlighting"
    path: screenshots/ss_5.jpg
  - description: "Dropdown following a dark theme"
    path: screenshots/ss_6.jpg

topics:
  - widget
  - dropdown
  - flutter-dropdown
  - custom-dropdown
  - animated-dropdown
